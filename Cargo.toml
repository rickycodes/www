[package]
name = "rickycodes"
version = "0.0.1"
authors = ["Ricky Miller"]
edition = "2024"
rust-version = "1.98"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
js-sys = "=0.3.105"
wasm-bindgen = "=0.2.128"

[dependencies.web-sys]
version = "=0.3.105"
features = [
    "console",
    "Document",
    "DomTokenList",
    "DragEvent",
    "Element",
    "Event",
    "EventTarget",
    "HtmlDetailsElement",
    "HtmlElement",
    "KeyboardEvent",
    "Location",
    "MediaQueryList",
    "MediaQueryListEvent",
    "MouseEvent",
    "Node",
    "NodeList",
    "Storage",
    "Window",
]

[profile.release]
# WASM size-focused defaults.
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
debug = false
