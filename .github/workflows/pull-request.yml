name: Pull Request Validation

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "src/**"
      - "static/**"
      - "package.json"
      - "package-lock.json"
      - "build.sh"
      - "scripts/**"
      - ".github/workflows/pull-request.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Cache wasm-bindgen CLI
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/wasm-bindgen*
          key: ${{ runner.os }}-wasm-bindgen-cli-0.2.128

      - name: Cache Rust dependencies/build
        uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: ". -> target"
          shared-key: "pull-request-stable-1.98.1"
          cache-on-failure: true

      - name: Setup wasm build toolchain
        run: bash scripts/setup-wasm-toolchain-ci.sh

      - name: Build and check deploy bundle
        run: ./build.sh --generate --build --minify

      - name: Run browser smoke test
        run: bash scripts/run-browser-smoke.sh
