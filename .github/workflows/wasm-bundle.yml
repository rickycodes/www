name: Build Wasm Bundle

on:
  push:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "src/*.rs"
      - "src/**/*.rs"
      - "build.sh"
      - "scripts/require-wasm-bindgen.sh"
      - "scripts/strip-wasm.sh"
      - "scripts/version-wasm-loader.sh"
      - "scripts/setup-wasm-toolchain-ci.sh"
      - ".github/workflows/wasm-bundle.yml"
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: wasm-bundle
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # This is the job to move onto a prebuilt toolchain image later.
    # Example future shape:
    # container: ghcr.io/rickycodes/www-buildenv:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache wasm-bindgen CLI
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/wasm-bindgen*
          key: ${{ runner.os }}-wasm-bindgen-cli-0.2.128

      - name: Cache Rust dependencies/build
        uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: ". -> target"
          shared-key: "pages-stable-1.98.1"
          cache-on-failure: true

      - name: Restore wasm bundle cache
        id: wasm_bundle_cache
        uses: actions/cache@v5
        with:
          path: .ci-cache/wasm
          key: ${{ runner.os }}-wasm-bundle-v3-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'src/*.rs', 'src/**/*.rs', 'build.sh', 'scripts/require-wasm-bindgen.sh', 'scripts/strip-wasm.sh', 'scripts/version-wasm-loader.sh', 'scripts/setup-wasm-toolchain-ci.sh', '.github/workflows/wasm-bundle.yml') }}

      - name: Setup wasm build toolchain
        run: bash scripts/setup-wasm-toolchain-ci.sh

      - name: Check Rust
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings
          cargo test --locked

      - name: Build wasm bundle
        if: steps.wasm_bundle_cache.outputs.cache-hit != 'true'
        run: |
          ./build.sh --build
          mkdir -p .ci-cache/wasm
          cp target/deploy/rickycodes_bg.wasm .ci-cache/wasm/rickycodes_bg.wasm
          cp target/deploy/rickycodes.js .ci-cache/wasm/rickycodes.js

      - name: Verify wasm bundle cache
        run: |
          test -s .ci-cache/wasm/rickycodes_bg.wasm
          test -s .ci-cache/wasm/rickycodes.js

      - name: Upload wasm bundle artifact
        uses: actions/upload-artifact@v6
        with:
          name: wasm-bundle
          path: .ci-cache/wasm
          if-no-files-found: error
          retention-days: 30
